
services:
  aibirdlabcentral_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibirdlabcentral_api
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - D:/bird_shared:/app/shared_uploads
    depends_on:
      central_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bird_net
    restart: always

  central_db:
    image: postgres:17-alpine
    container_name: central_db
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bird_net
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aibirdlab_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bird_net
    restart: always

volumes:
  postgres_data:
    
networks:
  bird_net:
    external: true